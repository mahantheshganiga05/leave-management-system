<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Leave Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">


    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }


        body{

            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;

            background:
            linear-gradient(135deg,
            #667eea,
            #764ba2);

        }


        .login-container{

            width:900px;
            min-height:520px;

            background:white;

            border-radius:25px;

            overflow:hidden;

            display:flex;

            box-shadow:
            0 20px 50px rgba(0,0,0,0.2);

        }



        /* Left Section */

        .left-section{

            width:50%;

            background:
            linear-gradient(
            135deg,
            #4f46e5,
            #9333ea
            );

            color:white;

            display:flex;

            flex-direction:column;

            justify-content:center;

            align-items:center;

            padding:40px;

            text-align:center;

        }


        .logo{

            width:90px;

            height:90px;

            border-radius:50%;

            background:white;

            display:flex;

            align-items:center;

            justify-content:center;

            margin-bottom:20px;

        }


        .logo i{

            font-size:45px;

            color:#6366f1;

        }



        .left-section h1{

            font-size:32px;

            font-weight:700;

        }


        .left-section p{

            opacity:0.9;

            margin-top:15px;

        }





        /* Right Section */

        .right-section{

            width:50%;

            padding:50px;

            display:flex;

            flex-direction:column;

            justify-content:center;

        }


        .right-section h2{

            font-weight:700;

            margin-bottom:10px;

            color:#333;

        }


        .subtitle{

            color:#777;

            margin-bottom:30px;

        }




        .form-control{

            height:50px;

            border-radius:12px;

            padding-left:45px;

        }



        .input-box{

            position:relative;

            margin-bottom:20px;

        }



        .input-box i{

            position:absolute;

            left:15px;

            top:15px;

            color:#6366f1;

        }




        .btn-login{

            height:50px;

            border:none;

            border-radius:12px;

            background:

            linear-gradient(
            135deg,
            #6366f1,
            #9333ea
            );

            color:white;

            font-size:17px;

            font-weight:600;

            transition:0.3s;

        }



        .btn-login:hover{

            transform:translateY(-2px);

            box-shadow:
            0 10px 20px rgba(99,102,241,0.4);

        }



        .bottom-text{

            margin-top:25px;

            text-align:center;

            color:#666;

        }



        .bottom-text a{

            color:#6366f1;

            text-decoration:none;

            font-weight:600;

        }




        @media(max-width:768px){

            .login-container{

                width:90%;

                flex-direction:column;

            }


            .left-section,
            .right-section{

                width:100%;

            }

        }


    </style>

</head>


<body>


<div class="login-container">


    <!-- Left Side -->

    <div class="left-section">


        <div class="logo">

            <i class="fa-solid fa-user-clock"></i>

        </div>


        <h1>
            Leave Management System
        </h1>


        <p>
            Smart attendance and leave approval platform
            for students, faculty and administrators.
        </p>


    </div>





    <!-- Login Form -->


    <div class="right-section">


        <h2>
            Welcome Back 👋
        </h2>


        <p class="subtitle">
            Login to continue your account
        </p>



        <form method="POST"
        action="{{ url_for('auth.login') }}">



            <div class="input-box">

                <i class="fa fa-envelope"></i>

                <input 
                type="email"
                class="form-control"
                name="email"
                placeholder="Email Address"
                required>

            </div>





            <div class="input-box">

                <i class="fa fa-lock"></i>


                <input 
                type="password"
                class="form-control"
                name="password"
                placeholder="Password"
                required>


            </div>





            <button 
            type="submit"
            class="btn btn-login w-100">

                Login

            </button>


        </form>





        <div class="bottom-text">

            Don't have an account?

            <a href="{{ url_for('auth.register') }}">
                Register
            </a>

        </div>



    </div>



</div>



</body>

</html>
